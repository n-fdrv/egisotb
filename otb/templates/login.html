{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white text-center">
                    <h4 class="mb-0">Войти</h4>
                </div>
                <div class="card-body p-4">
                    <form method="post" class="needs-validation" novalidate>
                        {% csrf_token %}
                        <!-- Логин -->
                        <div class="mb-3">
                            <label for="id_username" class="form-label">Логин</label>
                            <input type="text" class="form-control" id="id_username" name="username" required>
                            <div class="invalid-feedback">Введите логин</div>
                        </div>

                        <!-- Пароль -->
                        <div class="mb-3">
                            <label for="id_password" class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="id_password" name="password" required minlength="8">
                            <div class="invalid-feedback">Введите пароль</div>
                        </div>

                        <!-- Кнопка -->
                        <button class="btn btn-primary w-100 mt-3" type="submit">Войти</button>
                        <p class="mt-3 mb-0 text-center">
                            Нет аккаунта?
                            <a href="{% url 'register' %}">Регистрация</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% load static %}
<script src="{% static 'js/login.js' %}"></script>
{% endblock %}
